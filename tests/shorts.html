<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>CustomYT Shorts 검증</title>
<link rel="stylesheet" href="/content.css"><link rel="stylesheet" href="/shorts.css">
<style>
body{margin:0;background:#141414;color:white;font:14px system-ui}button,input,select{font:inherit;padding:8px;color:inherit;background:#333;border:1px solid #777;border-radius:8px}
ytd-masthead{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 20px;background:#202020;position:relative;z-index:2020}#end{display:flex}
#test-tools{position:fixed;bottom:0;left:0;z-index:2030;background:#333}
ytd-shorts{display:block;height:calc(100vh - 56px)}#shorts-container{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory}
.slot{height:100%;scroll-snap-align:start;position:relative}ytd-reel-video-renderer{display:block;height:100%}
#player-container{position:relative;margin:auto;width:320px;height:570px;background:#173945}
ytd-player,#container,#shorts-player{display:block;width:100%;height:100%;position:relative}video{width:100%;height:100%;object-fit:contain}
yt-reel-metapanel-view-model{position:absolute;left:32px;bottom:60px;width:270px;display:flex;flex-direction:column}
reel-action-bar-view-model{position:absolute;right:180px;top:60px;display:flex;flex-direction:column;gap:16px;width:65px}
ytd-engagement-panel-section-list-renderer{display:none;position:fixed;right:12px;top:70px;width:320px;height:520px;background:#292929}
ytd-engagement-panel-section-list-renderer[visibility="ENGAGEMENT_PANEL_VISIBILITY_EXPANDED"]{display:flex;flex-direction:column}#content{overflow:auto}header{padding:12px} [hidden]{display:none!important}
</style></head><body>
<ytd-masthead><strong>YouTube · Shorts 검증</strong><div id="end"><button>프로필</button></div></ytd-masthead>
<ytd-shorts><div id="shorts-container"><div class="slot"><ytd-reel-video-renderer><div id="player-container"><ytd-player><div id="container"><div id="shorts-player"><div class="html5-video-container"><video muted autoplay playsinline></video></div></div></div></ytd-player></div></ytd-reel-video-renderer><yt-reel-metapanel-view-model><strong id="title">Shorts 1</strong><span>@fixture · 구독</span></yt-reel-metapanel-view-model><reel-action-bar-view-model><button>좋아요</button><button id="comments-open">댓글 열기</button><button>공유</button></reel-action-bar-view-model></div><div class="slot">다음 스크롤 슬롯</div></div>
<ytd-engagement-panel-section-list-renderer target-id="engagement-panel-comments-section" visibility="ENGAGEMENT_PANEL_VISIBILITY_HIDDEN"><header>댓글 <button id="comments-close">댓글 닫기</button></header><div id="content"></div></ytd-engagement-panel-section-list-renderer></ytd-shorts>
<div id="test-tools"><button id="next-short">다음 Shorts</button><button id="route-watch">일반 영상으로 이동</button></div>
<script src="/tests/shorts-fixture.js"></script><script src="/layout.js"></script><script src="/content.js"></script><script src="/shorts.js"></script></body></html>
